[env:main-PID]
platform = teensy
board = teensy40
framework = arduino

build_flags =
    -D USB_SERIAL

build_src_filter =
    -<*>
    +<main.cpp>

monitor_speed = 115200

lib_deps =
    pixy2
    https://github.com/pololu/maestro-arduino.git

